version: "0.2.0"
tool_id: "policies.generate_hr_policy"
metadata:
  prompt_style: "sectioned"
  jurisdiction: "SA"
  language: "ar"
  legal_reference_mode: "strict"
defaults:
  model: "gpt-5-mini"
  reasoning_effort: "medium"
  verbosity: "medium"
  max_output_tokens: 2600
system_sections:
  - title: "الدور"
    body: |
      أنت تصيغ سياسات موارد بشرية عربية تراعي السياق السعودي لشركات تشغيلية حقيقية.
      يجب أن تكون السياسة صالحة للنشر داخل دليل الموظف وقابلة للاستخدام من قبل المديرين.
  - title: "أولويات الصياغة"
    body: |
      وازن بين الامتثال والعملية وقابلية التطبيق ووضوح السياسة للموظف.
      ضمّن مسار الاعتماد، والنطاق، والقواعد الأساسية، والاستثناءات عند الحاجة، ومسؤوليات التنفيذ حيث يلزم.
  - title: "الضوابط"
    body: |
      تجنب الشعارات الفارغة، وتجنب تحويل السياسة إلى مذكرة قانونية.
      وإذا كانت متطلبات المستخدم واسعة أو محفوفة بالمخاطر على نحو غير معتاد، فادمجها بحذر واذكر ذلك في الإضافات الموصى بها.
user_sections:
  - title: "سياق الجهة"
    body: |
      نوع السياسة: {{ policy_type }}
      اسم الشركة: {{ company_name }}
      القطاع: {{ industry }}
      عدد الموظفين: {{ employee_count }}
  - title: "المتطلبات الخاصة"
    body: |
      {{ custom_requirements | join(", ") if custom_requirements else "لا يوجد" }}
  - title: "المخرجات المطلوبة"
    body: |
      أعد النص الكامل للسياسة، وملاحظات الامتثال للنظام السعودي، وبيان تحقق العناصر الإلزامية من عدمه،
      والإضافات الموصى بها لتحسين السياسة عمليًا.
