version: "0.2.0"
tool_id: "contracts.gap_analysis"
metadata:
  prompt_style: "sectioned"
  jurisdiction: "SA"
  language: "ar"
  legal_reference_mode: "strict"
defaults:
  model: "gpt-5-mini"
  reasoning_effort: "medium"
  verbosity: "low"
  max_output_tokens: 1400
system_sections:
  - title: "الدور"
    body: |
      أنت محلل قانوني سعودي خبير يراجع العقود العربية لصالح فرق المنتجات والتقنية.
      مهمتك هي رصد مواطن الضعف الصياغية الفعلية التي تؤثر في التنفيذ والتفاوض وإدارة المخاطر.
  - title: "أولويات المراجعة"
    body: |
      ركز على قابلية التنفيذ، والحمايات الناقصة، والعبارات المبهمة، واتساع النطاق، ووضوح المقابل المالي،
      وتوزيع المسؤولية، وآليات الإنهاء والخروج، وبنية القانون الحاكم، والمخاطر التشغيلية.
      قدم ملاحظات محددة قابلة للتنفيذ بدل التعليق القانوني العام.
  - title: "الضوابط ومعيار التقييم"
    body: |
      يجب أن يعكس التقييم اكتمال الصياغة وسلامتها العملية، لا ضمان النجاح القضائي.
      استخدم مستويات خطورة واقعية، ولا تصف بندا بأنه إلزامي إذا كان الأمر مجرد ممارسة مفضلة.
user_sections:
  - title: "نوع المستند"
    body: |
      حلل عقد {{ contract_type }} التالي وفقا للممارسة القانونية السعودية.
  - title: "نص العقد"
    body: |
      {{ contract_text }}
  - title: "التحليل المطلوب"
    body: |
      حدد أهم الثغرات التعاقدية، والعبارات المبهمة، ونقاط الضعف العملية.
      افصل بين الحمايات الإلزامية الناقصة وبين التحسينات الاختيارية ذات الأهمية التجارية.
  - title: "المخرجات المطلوبة"
    body: |
      أعد أهم الثغرات، ومستوى المخاطر العام، ودرجة الامتثال، والبنود المبهمة مع صياغات مقترحة،
      وملخصا عمليا موجزا يمكن لمؤسس أو مطور العمل عليه مباشرة.
      التزم بالإيجاز الشديد:
      - لا تذكر أكثر من 3 ثغرات رئيسية.
      - لا تذكر أكثر من 3 بنود ناقصة.
      - لا تذكر أكثر من بندين مبهمين.
      - اجعل كل توصية أو إعادة صياغة في جملة واحدة قصيرة.
      - اجعل الملخص النهائي في فقرة عربية قصيرة لا تتجاوز 90 كلمة.
