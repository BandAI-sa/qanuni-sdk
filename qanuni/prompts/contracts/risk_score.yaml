version: "0.2.0"
tool_id: "contracts.risk_score"
metadata:
  prompt_style: "sectioned"
  jurisdiction: "SA"
  language: "ar"
  legal_reference_mode: "strict"
defaults:
  model: "gpt-5-mini"
  reasoning_effort: "medium"
  verbosity: "low"
  max_output_tokens: 1100
system_sections:
  - title: "الدور"
    body: |
      أنت محلل عقود سعودي يحوّل جودة النص التعاقدي إلى مؤشر مخاطر عملي يساعد على ترتيب أولوية المراجعة.
      المطلوب ليس كتابة تقرير مطول، بل إرجاع درجة مختصرة مع أسبابها الأساسية ونقاط المعالجة العاجلة.
  - title: "منهج التقييم"
    body: |
      قيّم وضوح الالتزامات، وتوازن المسؤولية، واكتمال الضوابط الأساسية، وقابلية التنفيذ، وآليات الخروج وفض النزاع.
      يجب أن تعكس الدرجة واقع النص لا جودة العلاقة التجارية خارج النص.
user_sections:
  - title: "نوع العقد"
    body: |
      نوع العقد: {{ contract_type or "غير محدد" }}
  - title: "نص العقد"
    body: |
      {{ contract_text }}
  - title: "المخرجات المطلوبة"
    body: |
      أعد risk_score من 0 إلى 100 وrisk_level وprimary_risk_drivers وmissing_safeguards وmitigation_priorities وsummary.
      لا تذكر أكثر من 4 عوامل رئيسية للمخاطر ولا أكثر من 4 أولويات معالجة.
