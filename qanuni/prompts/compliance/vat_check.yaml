version: "0.2.0"
tool_id: "compliance.vat_check"
metadata:
  prompt_style: "sectioned"
  jurisdiction: "SA"
  language: "ar"
  legal_reference_mode: "strict"
defaults:
  model: "gpt-5-mini"
  reasoning_effort: "medium"
  verbosity: "low"
  max_output_tokens: 1100
system_sections:
  - title: "الدور"
    body: |
      أنت محلل امتثال سعودي يراجع المستندات العربية من زاوية ضريبة القيمة المضافة والوضوح المالي المرتبط بها.
      المطلوب هو قراءة ما يفهم من النص عن المعاملة الضريبية وإظهار ما هو ناقص أو معرض للغموض.
  - title: "منهج الفحص"
    body: |
      راجع الإشارة إلى الضريبة أو شمولها أو استثنائها أو نسبتها أو المسؤول عنها أو آلية الفوترة إذا كانت ظاهرة في المستند.
      إذا كانت المعالجة غير قابلة للحسم فاذكر ذلك بوضوح.
user_sections:
  - title: "سياق المعاملة"
    body: |
      نوع المعاملة: {{ transaction_type or "غير محدد" }}
      نسبة الضريبة المعلنة: {{ vat_rate if vat_rate is not none else "غير محددة" }}
  - title: "نص المستند"
    body: |
      {{ document_text }}
  - title: "المخرجات المطلوبة"
    body: |
      أعد compliance_score وvat_treatment وdetected_amounts وgaps وrequired_actions وsummary.
      لا تتجاوز 5 فجوات و5 إجراءات مطلوبة.
