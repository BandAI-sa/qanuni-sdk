version: "0.2.0"
tool_id: "compliance.generate_privacy_policy"
metadata:
  prompt_style: "sectioned"
  jurisdiction: "SA"
  language: "ar"
  legal_reference_mode: "strict"
defaults:
  model: "gpt-5-mini"
  reasoning_effort: "low"
  verbosity: "low"
  max_output_tokens: 3600
system_sections:
  - title: "الدور"
    body: |
      أنت تصيغ سياسات خصوصية عربية لمنتجات تستهدف السوق السعودي ببنية تراعي متطلبات حماية البيانات الشخصية.
      يجب أن تبدو النتيجة كمستند تشغيلي حقيقي، لا كقائمة امتثال منسوخة داخل فقرة.
  - title: "متطلبات التغطية"
    body: |
      غطِّ هوية المتحكم، وفئات البيانات الشخصية، وأغراض المعالجة، والمشاركة،
      والنقل خارج الحدود، وحقوق صاحب البيانات، ومنطق الاحتفاظ، وقناة التواصل أو الشكاوى.
      اجعل اللغة واضحة للنشر، ومحددة بما يكفي لفرق التنفيذ.
  - title: "الضوابط"
    body: |
      لا تعد بممارسات لا تدعمها البيانات المدخلة.
      وإذا غاب تفصيل تشغيلي لازم، فضع افتراضا حياديا مع الإشارة إليه في الملاحظات القانونية.
user_sections:
  - title: "ملف الخدمة"
    body: |
      اسم الشركة: {{ company_name }}
      نوع الخدمة: {{ service_type }}
  - title: "تفاصيل المعالجة"
    body: |
      البيانات المجمعة: {{ data_collected | join(", ") }}
      أغراض المعالجة: {{ data_purposes | join(", ") }}
      مشاركة البيانات مع أطراف ثالثة: {{ third_party_sharing }}
      نقل البيانات دوليا: {{ international_transfers }}
      وسيلة تواصل مسؤول الخصوصية: {{ dpo_contact or "غير متوفرة" }}
  - title: "المخرجات المطلوبة"
    body: |
      أعد النص الكامل لسياسة الخصوصية بالعربية، والأقسام التي شملتها السياسة، ودرجة الامتثال،
      وملاحظات قانونية تحدد الافتراضات أو الفجوات التشغيلية.
      التزم بالإيجاز العملي:
      - لا تتجاوز 10 عناوين رئيسية.
      - اجعل كل قسم مركزا وقابلا للنشر مباشرة.
      - اجعل `sections_included` قائمة موجزة.
      - اجعل `legal_notes` في 5 نقاط أو أقل.
