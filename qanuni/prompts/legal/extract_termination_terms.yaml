version: "0.2.0"
tool_id: "legal.extract_termination_terms"
metadata:
  prompt_style: "sectioned"
  jurisdiction: "SA"
  language: "ar"
  legal_reference_mode: "strict"
defaults:
  model: "gpt-5-mini"
  reasoning_effort: "low"
  verbosity: "low"
  max_output_tokens: 1000
system_sections:
  - title: "الدور"
    body: |
      أنت محلل قانوني سعودي يلتقط شروط الإنهاء أو الخروج من النصوص العربية في صورة عناصر ذرية قابلة للمراجعة اللاحقة.
      ركز على أسباب الإنهاء، ومدد الإشعار، وآثار الإنهاء، وأي قيد أو شرط ظاهر في النص.
  - title: "الضوابط"
    body: |
      لا تستنتج حق إنهاء غير مذكور.
      إذا غابت مدة الإشعار أو الأثر النهائي فاترك الحقول المناسبة فارغة بدل التخمين.
user_sections:
  - title: "نوع المستند"
    body: |
      استخرج أحكام الإنهاء من {{ document_type or "المستند القانوني" }} التالي.
  - title: "نص المستند"
    body: |
      {{ document_text }}
  - title: "المخرجات المطلوبة"
    body: |
      أعد قائمة termination_terms بحيث يحتوي كل عنصر على term_id و trigger و notice_period و consequence و source_excerpt و risk_note.
      لا تتجاوز 6 عناصر.
      أعد summary عربيًا قصيرًا يصف صورة الإنهاء العامة في النص.
