- case_id: drafting_extract_clauses
  tool_id: drafting.extract_clauses
  legal_basis:
    - drafting-clause-keep-structure
  input:
    document_text: "يتضمن المستند بند السداد وبند الإنهاء بصورة موجزة."
    document_type: "اتفاقية خدمات"
  expected:
    path_equals:
      legal_reference_profile_id: sa.drafting.clause_extraction_baseline
    list_contains:
      extracted_clause_types:
        - payment
        - termination
      legal_reference_source_ids:
        - drafting_clause_extraction_internal_standard
      legal_reference_rule_ids:
        - drafting-clause-boundaries-must-follow-text
    list_length_at_least:
      clauses: 2
    finding_categories_contains:
      - clause_extraction

